<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CapCut Web Clone - Studio</title>
    <style>
        :root {
            --bg-main: #121212;
            --bg-sidebar: #1e1e1e;
            --bg-timeline: #181818;
            --accent: #2f80ed;
            --text-main: #e0e0e0;
            --border-color: #333333;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            user-select: none;
        }

        body {
            background-color: var(--bg-main);
            color: var(--text-main);
            height: 100vh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        /* Top Navigation Header */
        header {
            height: 48px;
            background-color: var(--bg-sidebar);
            border-bottom: 1px solid var(--border-color);
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0 16px;
        }

        .logo {
            font-weight: 700;
            font-size: 18px;
            color: #fff;
            letter-spacing: 0.5px;
        }

        .export-btn {
            background-color: var(--accent);
            color: white;
            border: none;
            padding: 6px 16px;
            border-radius: 4px;
            cursor: pointer;
            font-weight: 600;
            font-size: 13px;
            transition: background 0.2s;
        }

        .export-btn:hover {
            background-color: #1b69d6;
        }

        /* Main Workspace Layout */
        .workspace {
            flex: 1;
            display: flex;
            height: calc(100vh - 48px - 250px); /* Remaining space above timeline */
        }

        /* Asset Panel (Left) */
        .asset-panel {
            width: 320px;
            background-color: var(--bg-sidebar);
            border-right: 1px solid var(--border-color);
            display: flex;
            flex-direction: column;
            padding: 16px;
        }

        .upload-box {
            border: 2px dashed var(--border-color);
            border-radius: 8px;
            padding: 30px 16px;
            text-align: center;
            cursor: pointer;
            transition: border-color 0.2s;
        }

        .upload-box:hover {
            border-color: var(--accent);
        }

        .upload-box p {
            font-size: 13px;
            color: #888;
            margin-top: 8px;
        }

        #file-input {
            display: none;
        }

        .media-library {
            margin-top: 16px;
            flex: 1;
            overflow-y: auto;
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 8px;
            align-content: start;
        }

        .media-thumb {
            width: 100%;
            aspect-ratio: 16/9;
            background: #000;
            border-radius: 4px;
            overflow: hidden;
            position: relative;
            border: 1px solid var(--border-color);
        }

        .media-thumb video {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        /* Player Panel (Center/Right) */
        .player-panel {
            flex: 1;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            background-color: var(--bg-main);
            padding: 16px;
            position: relative;
        }

        .video-container {
            width: 100%;
            max-width: 640px;
            aspect-ratio: 16/9;
            background-color: #000;
            box-shadow: 0 4px 20px rgba(0,0,0,0.5);
            border-radius: 4px;
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .video-container video {
            width: 100%;
            height: 100%;
        }

        .player-controls {
            margin-top: 12px;
            display: flex;
            gap: 16px;
            align-items: center;
        }

        .control-btn {
            background: none;
            border: none;
            color: white;
            font-size: 20px;
            cursor: pointer;
        }

        /* Timeline Area (Bottom) */
        .timeline-container {
            height: 250px;
            background-color: var(--bg-timeline);
            border-top: 1px solid var(--border-color);
            display: flex;
            flex-direction: column;
        }

        .timeline-toolbar {
            height: 36px;
            border-bottom: 1px solid var(--border-color);
            display: flex;
            align-items: center;
            padding: 0 16px;
            gap: 12px;
        }

        .tool-btn {
            background: none;
            border: none;
            color: #aaa;
            font-size: 13px;
            cursor: pointer;
            padding: 4px 8px;
            border-radius: 4px;
        }

        .tool-btn:hover {
            background-color: #2a2a2a;
            color: #fff;
        }

        .timeline-tracks {
            flex: 1;
            position: relative;
            overflow-x: auto;
            overflow-y: hidden;
            padding: 12px 0;
        }

        .track {
            height: 60px;
            background-color: #202020;
            margin-bottom: 8px;
            position: relative;
            border-radius: 4px;
            width: 2000px; /* Simulated infinite width for editing timeline */
        }

        .timeline-clip {
            position: absolute;
            height: 100%;
            background: linear-gradient(90deg, #3b5998, #2f80ed);
            border: 1px solid #4d96ff;
            border-radius: 4px;
            color: white;
            font-size: 11px;
            display: flex;
            align-items: center;
            padding: 0 8px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            cursor: grab;
        }

        .playhead {
            position: absolute;
            top: 0;
            bottom: 0;
            width: 2px;
            background-color: #ff3b30;
            left: 50px;
            z-index: 10;
            pointer-events: none;
        }

        .playhead::before {
            content: '';
            position: absolute;
            top: 0;
            left: -5px;
            border-left: 6px solid transparent;
            border-right: 6px solid transparent;
            border-top: 8px solid #ff3b30;
        }
    </style>
</head>
<body>

    <header>
        <div class="logo">StudioCap Web</div>
        <button class="export-btn" onclick="alert('Export processing initialized (Demo UI Feature).')">Export</button>
    </header>

    <div class="workspace">
        <!-- Media Asset Section -->
        <div class="asset-panel">
            <div class="upload-box" onclick="document.getElementById('file-input').click()">
                <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="color: var(--accent);"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path><polyline points="17 8 12 3 7 8"></polyline><line x1="12" y1="3" x2="12" y2="15"></line></svg>
                <p>Click to import media assets</p>
                <input type="file" id="file-input" accept="video/*" onchange="handleFileImport(event)">
            </div>
            <div class="media-library" id="media-library">
                <!-- Dynamically loaded media goes here -->
            </div>
        </div>

        <!-- Video Player Viewport -->
        <div class="player-panel">
            <div class="video-container">
                <video id="main-preview" controls></video>
            </div>
            <div class="player-controls">
                <button class="control-btn" onclick="togglePlay()">⏯</button>
            </div>
        </div>
    </div>

    <!-- Timeline Workspace -->
    <div class="timeline-container">
        <div class="timeline-toolbar">
            <button class="tool-btn" onclick="splitClip()">✂️ Split</button>
            <button class="tool-btn" onclick="deleteClip()">🗑 Delete</button>
        </div>
        <div class="timeline-tracks" id="timeline-scroll-area">
            <div class="playhead" id="timeline-playhead"></div>
            <!-- Video Track -->
            <div class="track" id="video-track">
                <!-- Clips drop down here -->
            </div>
            <!-- Audio/Effects Track -->
            <div class="track" id="audio-track"></div>
        </div>
    </div>

    <script>
        const preview = document.getElementById('main-preview');
        const mediaLibrary = document.getElementById('media-library');
        const videoTrack = document.getElementById('video-track');
        const playhead = document.getElementById('timeline-playhead');
        let currentClipData = null;

        // Functional Asset Import Module
        function handleFileImport(event) {
            const file = event.target.files[0];
            if (!file) return;

            const objectURL = URL.createObjectURL(file);
            currentClipData = { url: objectURL, name: file.name };
